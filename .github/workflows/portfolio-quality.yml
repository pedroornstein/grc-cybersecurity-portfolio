name: Portfolio documentation and synthetic-data QA

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Validate portfolio and synthetic control test
        run: python scripts/validate_portfolio.py
      - name: Test synthetic offboarding analyzer boundaries
        run: python -m unittest discover -s tests -p 'test_*.py' -v
